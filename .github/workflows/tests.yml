name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all:
    # tests/run-all.sh: version consistency, unit tests, ESLint, HTML validation, and the browser tests
    # (core, storage, a11y) in Chromium, Firefox and WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install playwright-cli and browsers
        run: |
          npm install -g @playwright/cli@0.1.21
          for b in chromium firefox webkit; do playwright-cli install-browser --with-deps "$b"; done
      - name: Run all checks
        run: tests/run-all.sh
